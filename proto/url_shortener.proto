//Questo file definisce l’API gRPC per il servizio URL shortener
//Service name: UrlShortenerService
//RPC: CreateShortUrl, ResolveShortUrl, GetStats

syntax = "proto3";

package urlshortener.v1;

import "google/protobuf/timestamp.proto";

service UrlShortenerService {

}

message CreateShortUrlRequest {
    string original_url = 1;   //URL lunga da accorciare, deve iniziare con http/https.
}

message CreateShortUrlResponse {
    string code = 1;
    string short_url = 2;
    string original_url = 3;
    google.protobuf.Timestamp created_at = 4;  //data di creazione originale, non cambia in caso di idempotenza
}

message ResolveShortUrlRequest {
    string code = 1;    //Codice corto da risolvere
}

message ResolveShortUrlResponse {
    string original_url = 1; 
}

message GetStatRequest {
    string code = 1;
}

message GetStatResponse {
    string code = 1;
    string orignal_url = 2;
    int64 acces_count = 3;
    google.protobuf.Timestamp created_at = 4;
    google.protobuf.Timestamp last_access_at = 5;
}